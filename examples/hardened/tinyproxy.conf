# No User/Group on purpose. The container already runs as nobody, and with
# cap_drop: ALL there is no CAP_SETGID left to change identity with — tinyproxy
# exits 77 ("Unable to change to group") if it tries.
Port 3128
Listen 0.0.0.0
Timeout 600

# Who may use the proxy. The harness network is internal and can reach nothing
# else, so membership of that network is the real authentication.
Allow 0.0.0.0/0

# The allowlist. DefaultDeny means a host must match a line in the file to be
# reachable at all — for both plain HTTP and HTTPS CONNECT.
FilterDefaultDeny Yes
FilterExtended On
Filter "/etc/tinyproxy/allowlist"

# Only ordinary TLS. Without this, CONNECT would tunnel to any port.
ConnectPort 443

DisableViaHeader Yes
PidFile "/var/run/tinyproxy/tinyproxy.pid"
LogLevel Info
